<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ShopRateio</title>
  
  <!-- PWA & Mobile Optimization -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Gestão de Rateio para Shoppings - Modo Offline">
  
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3144/3144456.png">

  <script>
    // Early dark theme application to avoid white flash in dark rooms / basements
    try {
      const savedTheme = localStorage.getItem('shop_rateio_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}

    // Runtime process.env shim for client-side API calls
    window.process = window.process || { env: {} };
    window.process.env = window.process.env || {};
    window.process.env.API_KEY = window.process.env.API_KEY || 'PLACEHOLDER_API_KEY';
    window.process.env.GEMINI_API_KEY = window.process.env.GEMINI_API_KEY || 'PLACEHOLDER_API_KEY';
    window.process.env.GROQ_API_KEY = window.process.env.GROQ_API_KEY || 'PLACEHOLDER_API_KEY';
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            secondary: '#334155',
            accent: '#3b82f6',
            success: '#10b981',
            warning: '#f59e0b',
            danger: '#ef4444',
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f1f5f9;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none; /* Better app feel */
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    html.dark body {
      background-color: #020617; /* Deep OLED black / Slate 950 */
      color: #f8fafc;
    }
    input, textarea { user-select: text; } /* Allow selection in inputs */

    /* Safe Area Insets for Mobile App feel */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    html.dark ::-webkit-scrollbar-track { background: #020617; }
    html.dark ::-webkit-scrollbar-thumb { background: #334155; }
    html.dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@^21.1.3?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@^21.1.3?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.1.3?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@^21.1.3?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@^21.1.3?external=rxjs",
    "d3": "https://esm.sh/d3@^7.9.0?external=rxjs",
    "ngx-markdown": "https://esm.sh/ngx-markdown@^21.1.0?external=rxjs"
  }
}
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered!', reg))
        .catch(err => console.log('SW reg error', err));
    });
  }
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="overflow-hidden"> <!-- Prevent body scroll if main/sidebar handles it -->
  <app-root></app-root>
</body>
</html>
